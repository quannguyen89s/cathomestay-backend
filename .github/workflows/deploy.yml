name: Deploy Backend to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Verify TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands to update and rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo " Đang cập nhật code Backend..."
            cd /var/www/cathomestay-backend
            git pull origin main

            echo " Rebuilding Backend Docker container..."
            cd /var/www
            docker compose up -d --build backend

            echo " Dọn dẹp images cũ không dùng..."
            docker image prune -f
            echo " Deploy Backend hoàn tất!"
